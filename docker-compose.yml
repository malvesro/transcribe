services:
  webapp:
    build:
      context: ./transcriber_web_app
      dockerfile: Dockerfile.flask
    ports:
      - "5000:5000"
    volumes:
      - ./transcriber_web_app/videos:/app/videos
      - ./transcriber_web_app/results:/app/results
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DOCKER_COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    depends_on:
      - whisper_worker
    networks:
      - transcriber_network

  whisper_worker:
    image: transcriber-worker:1.2
    build:
      context: ./transcriber_web_app
      dockerfile: Dockerfile.whisper
      tags:
        - "transcriber-worker:1.2"
    volumes:
      - ./transcriber_web_app/videos:/data/videos:ro
      - ./transcriber_web_app/results:/data/results
      - whisper_models:/root/.cache/whisper
    # Para GPU (NVIDIA):
    # Esta configuração requer que o NVIDIA Container Toolkit esteja instalado
    # e configurado corretamente no sistema host.
    # Se a GPU não for detectada, verifique a instalação do Toolkit.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - transcriber_network

volumes:
  whisper_models:

networks:
  transcriber_network:
    driver: bridge
