services:
  webapp:
    build:
      context: ./transcriber_web_app
      dockerfile: Dockerfile.flask
    ports:
      - "5000:5000"
    volumes:
      - ./transcriber_web_app/videos:/app/videos
      - ./transcriber_web_app/results:/app/results
      # Montar o socket Docker para permitir que este container execute comandos docker
      # ATENÇÃO: Isso concede privilégios elevados ao container
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=${FLASK_ENV:-development}
      - DOCKER_COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-transcribe}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-transcribe}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      # Configuração do limite de tamanho de arquivo (padrão: 15GB)
      - MAX_FILE_SIZE_GB=${MAX_FILE_SIZE_GB:-15}
    depends_on:
      - whisper_worker
    networks:
      - transcriber_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  whisper_worker:
    build:
      context: ./transcriber_web_app
      dockerfile: Dockerfile.whisper
    volumes:
      - ./transcriber_web_app/videos:/data/videos:ro # :ro para read-only, já que o worker não deve modificar o vídeo original
      - ./transcriber_web_app/results:/data/results
      - whisper_models:/root/.cache/whisper # Volume nomeado para cache de modelos Whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # ou o número de GPUs que deseja alocar
              capabilities: [gpu]
    # Configuração alternativa para GPU (descomente se necessário):
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - transcriber_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import torch; print('GPU:', torch.cuda.is_available())"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

volumes:
  whisper_models:
    # driver: local # Opcional, local é o padrão

networks:
  transcriber_network:
    driver: bridge
