services:
  webapp:
    build:
      context: ./transcriber_web_app
      dockerfile: Dockerfile.flask
    ports:
      - "5000:5000"
    volumes:
      - ./transcriber_web_app/videos:/app/videos
      - ./transcriber_web_app/results:/app/results

    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0

    depends_on:
      - redis
      - whisper_worker

    networks:
      - transcriber_network

  whisper_worker:
    image: transcriber-worker:1.3

    build:
      context: ./transcriber_web_app
      dockerfile: Dockerfile.whisper
    volumes:
      - ./transcriber_web_app/videos:/data/videos:ro
      - ./transcriber_web_app/results:/data/results
      - whisper_models:/root/.cache/whisper
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: python3 /app/worker.py

    # Configuração de GPU movida para docker-compose.gpu.yml para evitar erros em sistemas sem GPU.
    # O script de inicialização (start.bat / start-whisper.sh) detectará automaticamente se deve usar a GPU.

    networks:
      - transcriber_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - transcriber_network

volumes:
  whisper_models:


networks:
  transcriber_network:
    driver: bridge
